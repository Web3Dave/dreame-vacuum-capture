<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity - Dreame Companion</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
      --text: #1c1e21; --muted: #6b7280; --accent: #03a9f4; --ok: #2e7d32; --bad: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1b1f24; --line:#2b3138; --text:#e8eaed; --muted:#9aa4b2; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 12px; background:var(--bg); color:var(--text);
           font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           overflow-x:hidden; }
    header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    h1 { font-size:20px; margin:0; font-weight:600; }
    .sub { color:var(--muted); font-size:13px; }
    .pill { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    .pill.ok { color:var(--ok); border-color:var(--ok); }
    .pill.bad { color:var(--bad); border-color:var(--bad); }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .card h2 { font-size:16px; margin:0 0 2px; font-weight:600; }
    .model { color:var(--muted); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
    td { padding:5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
    td:first-child { color:var(--muted); width:38%; }
    td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
    .empty { background:var(--card); border:1px dashed var(--line); border-radius:12px;
             padding:28px; text-align:center; color:var(--muted); }
    code { background:rgba(127,127,127,.14); padding:1px 5px; border-radius:4px;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
    footer { margin-top:28px; color:var(--muted); font-size:12px; }
    .todo { margin-top:24px; }
    .todo ul { margin:8px 0 0; padding-left:20px; }
    .todo li { margin:3px 0; }
  </style>

  <style>
    nav { display:flex; gap:4px; margin:0 0 20px; border-bottom:1px solid var(--line);
          width:100%; max-width:100vw; overflow-x:auto; flex-wrap:nowrap;
          -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none; }
    nav::-webkit-scrollbar { display:none; }
    nav a { flex:0 0 auto; padding:8px 14px; white-space:nowrap; text-decoration:none; color:var(--muted); font-size:14px;
            border-bottom:2px solid transparent; margin-bottom:-1px; }
    nav a:hover { color:var(--text); }
    nav a[aria-current="page"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
    .run { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:14px 16px; margin-bottom:10px; }
    .run-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .run-head .cmd { font-weight:600; }
    .run-head time { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    .run .summary { margin:6px 0 0; font-size:14px; }
    .run pre { margin:10px 0 0; padding:10px 12px; background:rgba(127,127,127,.10);
               border-radius:8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
               font-size:12.5px; line-height:1.65; overflow-x:auto; white-space:pre; }
    .run .err { color:var(--bad); font-size:13px; margin:6px 0 0; }
    .pill.run-live { color:var(--accent); border-color:var(--accent); }
    .pill.run-live::before { content:""; display:inline-block; width:6px; height:6px;
      border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:1px;
      animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    @media (prefers-reduced-motion:reduce) { .pill.run-live::before { animation:none } }
    .run pre .t { color:var(--muted); }
    .run pre.waiting { color:var(--muted); font-style:italic; }
  </style>

  <style>
    .settings-menu { margin-left:auto; position:relative; display:flex; align-items:center; }
    .settings-btn { border:none; background:transparent; color:var(--muted); cursor:pointer;
                    padding:6px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
    .settings-btn:hover { color:var(--text); background:rgba(127,127,127,.12); }
    .settings-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .settings-btn svg { width:19px; height:19px; fill:none; stroke:currentColor;
                        stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .settings-dropdown { position:absolute; top:calc(100% + 6px); right:0; background:var(--card);
                         border:1px solid var(--line); border-radius:8px;
                         box-shadow:0 6px 20px rgba(0,0,0,.18); min-width:200px; padding:4px; z-index:30; }
    .settings-dropdown a { display:block; padding:8px 10px; font-size:13.5px; color:var(--text);
                           text-decoration:none; border-radius:6px; }
    .settings-dropdown a:hover { background:rgba(127,127,127,.12); }
  </style>
</head>
<body>
  <header>
    <h1>Dreame Companion</h1>
    {% if viewer %}<span class="sub">signed in as {{ viewer }}</span>{% endif %}
  </header>

  <nav>
    <a href="{{ base }}/">Devices</a>
    <a href="{{ base }}/tasks"{% if page == 'tasks' %} aria-current="page"{% endif %}>Tasks</a>
    <a href="{{ base }}/tags"{% if page == 'tags' %} aria-current="page"{% endif %}>Tags</a>
    <a href="{{ base }}/classifications"{% if page == 'classifications' %} aria-current="page"{% endif %}>Classifications</a>
    <a href="{{ base }}/cleaning"{% if page == 'cleaning' %} aria-current="page"{% endif %}>Cleaning</a>
    <a href="{{ base }}/maps"{% if page == 'maps' %} aria-current="page"{% endif %}>Maps</a>
    <a href="{{ base }}/activity"{% if page == 'activity' %} aria-current="page"{% endif %}>Activity</a>
      <div class="settings-menu">
      <button type="button" class="settings-btn" id="settings-btn" aria-haspopup="true" aria-expanded="false" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="settings-dropdown" id="settings-dropdown" hidden>
        <a href="{{ base }}/config">Config</a>
        <a href="{{ base }}/voice">Custom voice</a>
      </div>
    </div>
</nav>
  <script>
    (function () {
      var btn = document.getElementById("settings-btn");
      var menu = document.getElementById("settings-dropdown");
      if (!btn || !menu) return;
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var opening = menu.hidden;
        menu.hidden = !opening;
        btn.setAttribute("aria-expanded", String(opening));
      });
      document.addEventListener("click", function (e) {
        if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) {
          menu.hidden = true;
          btn.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>


  <div id="runs"></div>
  <footer id="foot"></footer>

  <script>
    const API = "{{ base }}/api/runs";
    const host = document.getElementById('runs');
    const foot = document.getElementById('foot');
    const when = ts => new Date(ts * 1000).toLocaleTimeString();

    function render(runs) {
      if (!runs.length) {
        host.innerHTML = '<div class="empty">' +
          '<p style="margin:0 0 6px"><strong>Nothing recorded yet</strong></p>' +
          '<p style="margin:0">Runs appear here while the integration performs an ' +
          'errand such as <code>inspect_point</code>.</p></div>';
        foot.textContent = '';
        return;
      }
      host.innerHTML = runs.map(run => {
        const badge = run.running ? '<span class="pill run-live">running</span>'
                    : run.ok ? '<span class="pill ok">ok</span>'
                             : '<span class="pill bad">failed</span>';
        const steps = (run.steps || []).map(s =>
          `<span class="t">${when(s.at)}</span>  ${esc(s.text)}`).join('\n');
        return `<div class="run">
          <div class="run-head">
            <span class="cmd">${esc(run.command)}</span>${badge}
            <time>${new Date(run.at * 1000).toLocaleString()}</time>
          </div>
          ${run.summary ? `<p class="summary">${esc(run.summary)}</p>` : ''}
          ${run.detail && run.detail.error ? `<p class="err">${esc(run.detail.error)}</p>` : ''}
          ${steps ? `<pre>${steps}</pre>` : (run.running ? '<pre class="waiting">waiting for the first step...</pre>' : '')}
        </div>`;
      }).join('');
      foot.textContent = `${runs.length} most recent of up to 200 kept. Updating every 2s.`;
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"]/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    async function poll() {
      try {
        const res = await fetch(API, {cache: 'no-store'});
        if (res.ok) render((await res.json()).runs || []);
      } catch (err) {
        foot.textContent = 'Lost contact with the add-on. Retrying.';
      }
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
