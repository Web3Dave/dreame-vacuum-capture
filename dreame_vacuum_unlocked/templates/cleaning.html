<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Cleaning - Dreame Companion</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
      --text: #1c1e21; --muted: #6b7280; --accent: #03a9f4; --ok: #2e7d32;
      --bad: #c62828; --clean: #03a9f4; --clean-dark: #0288d1;
      --tabbar-h: 88px; --cleanbar-h: 92px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1b1f24; --line:#2b3138; --text:#e8eaed; --muted:#9aa4b2; }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      -webkit-tap-highlight-color: transparent;
      /* Nothing may push the page wider than the screen; wide bars scroll
         inside themselves instead. */
      overflow-x: hidden;
    }
    /* ---- top page nav (kept slim) ---- */
    header { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
             padding:10px 16px 0; }
    h1 { font-size:18px; margin:0; font-weight:600; }
    .sub { color:var(--muted); font-size:13px; }
    nav { display:flex; gap:2px; margin:8px 0 0; padding:0 12px;
          border-bottom:1px solid var(--line); overflow-x:auto;
          width:100%; max-width:100vw; flex-wrap:nowrap;
          -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    nav a { flex:0 0 auto; padding:8px 13px; white-space:nowrap; text-decoration:none;
            color:var(--muted); font-size:14px; border-bottom:2px solid transparent; }
    nav a[aria-current="page"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
    .settings-menu { margin-left:auto; position:relative; display:flex; align-items:center; }
    .settings-btn { border:none; background:transparent; color:var(--muted); cursor:pointer;
                    padding:6px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
    .settings-btn:hover { color:var(--text); background:rgba(127,127,127,.12); }
    .settings-btn svg { width:19px; height:19px; fill:none; stroke:currentColor;
                        stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .settings-dropdown { position:absolute; top:calc(100% + 6px); right:0; background:var(--card);
                         border:1px solid var(--line); border-radius:8px;
                         box-shadow:0 6px 20px rgba(0,0,0,.18); min-width:200px; padding:4px; z-index:30; }
    .settings-dropdown a { display:block; padding:8px 10px; font-size:13.5px; color:var(--text);
                           text-decoration:none; border-radius:6px; }
    .settings-dropdown a:hover { background:rgba(127,127,127,.12); }

    /* ---- device selector ---- */
    .device-bar { display:flex; gap:10px; align-items:center; padding:12px 16px 4px; }
    select { font:inherit; font-size:14px; padding:7px 10px; border-radius:10px;
             border:1px solid var(--line); background:var(--card); color:var(--text);
             flex:1; min-width:0; }

    /* ---- Room / All / Zone tab bar: never wider than the screen, scrolls
           horizontally when the tabs inside it are too wide to fit ---- */
    #mode-tabs {
      display:flex; gap:8px; padding:10px 16px 8px;
      width:100%; max-width:100vw; overflow-x:auto;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
      -ms-overflow-style:none;
    }
    #mode-tabs::-webkit-scrollbar { display:none; }
    #mode-tabs > * { flex:0 0 auto; }
    .mode-tab {
      flex:0 0 auto; padding:9px 22px; border-radius:999px; font-size:15px;
      font-weight:600; color:var(--muted); background:var(--card);
      border:1px solid var(--line); cursor:pointer; white-space:nowrap;
      transition:color .15s, background .15s, border-color .15s;
    }
    .mode-tab.active { color:#fff; background:var(--accent); border-color:var(--accent); }
    .mode-tab .dot { font-size:12px; opacity:.8; margin-right:2px; }

    /* ---- main content ---- */
    #content { padding:6px 16px 0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    #map-canvas-wrap { display:flex; justify-content:center; margin-bottom:10px; }
    #map-canvas-wrap canvas { max-width:100%; height:auto; image-rendering:pixelated; border-radius:10px; }
    .status-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap;
                  color:var(--muted); font-size:13px; margin-top:6px; }
    .status-row .pill { font-size:12px; padding:2px 9px; border-radius:999px;
                        border:1px solid var(--line); color:var(--muted); }
    .status-row .pill.on { color:var(--ok); border-color:var(--ok); }
    .status-row .mode-pill { color:var(--accent); border-color:var(--accent); }

    /* ---- room selection chips ---- */
    #room-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .room-chip {
      padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600;
      color:var(--text); background:var(--card); border:1px solid var(--line);
      cursor:pointer; transition:all .12s; user-select:none;
    }
    .room-chip.selected { color:#fff; background:var(--clean); border-color:var(--clean); }
    .room-chip:not(.selected):active { border-color:var(--accent); }
    #room-order { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; min-height:0; }
    .order-pill { font-size:12px; padding:3px 10px; border-radius:999px;
                  background:var(--accent); color:#fff; display:inline-flex; align-items:center; gap:4px; }
    .order-pill .x { cursor:pointer; opacity:.85; font-weight:700; padding:0 2px; }
    .hint { color:var(--muted); font-size:13px; }
    .err { color:var(--bad); font-size:13px; }

    /* ---- shared Clean button: always visible, fixed at bottom ---- */
    #clean-bar {
      position:fixed; left:0; right:0; bottom:0; z-index:50;
      display:flex; align-items:center; justify-content:center; gap:12px;
      height:var(--cleanbar-h); padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      background:var(--bg); border-top:1px solid var(--line);
    }
    #clean-btn {
      flex:1; max-width:520px; height:52px; border:none; border-radius:999px;
      font-size:17px; font-weight:700; color:#fff; cursor:pointer;
      background:var(--clean); box-shadow:0 4px 14px rgba(3,169,244,.35);
      transition:transform .1s, background .15s;
    }
    #clean-btn:active { transform:scale(.98); }
    #clean-btn.paused { background:#ff9800; box-shadow:0 4px 14px rgba(255,152,0,.35); }
    #clean-btn.busy { background:var(--clean-dark); }
    #clean-btn:disabled { opacity:.5; cursor:not-allowed; }
    #clean-hint { color:var(--muted); font-size:12px; text-align:center; }

    /* reserve bottom space so content is never hidden behind the fixed bar */
    body { padding-bottom: calc(var(--cleanbar-h) + 8px); }
  </style>
</head>
<body>
  <header>
    <h1>Dreame Companion</h1>
    <span class="sub">Cleaning</span>
  </header>
  <nav>
    <a href="{{ base }}/">Devices</a>
    <a href="{{ base }}/tasks">Tasks</a>
    <a href="{{ base }}/tags">Tags</a>
    <a href="{{ base }}/classifications">Classifications</a>
    <a href="{{ base }}/cleaning" aria-current="page">Cleaning</a>
    <a href="{{ base }}/maps">Maps</a>
    <a href="{{ base }}/activity">Activity</a>
      <div class="settings-menu">
      <button type="button" class="settings-btn" id="settings-btn" aria-haspopup="true" aria-expanded="false" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="settings-dropdown" id="settings-dropdown" hidden>
        <a href="{{ base }}/config">Config</a>
        <a href="{{ base }}/voice">Custom voice</a>
      </div>
    </div>
  </nav>

  <div class="device-bar">
    <select id="device"><option value="">Loading devices...</option></select>
    <button class="action" id="refresh" style="font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;">Refresh</button>
  </div>

  <div id="mode-tabs">
    <div class="mode-tab" data-mode="room"><span class="dot">🏠</span>Room</div>
    <div class="mode-tab active" data-mode="all"><span class="dot">🧹</span>All</div>
    <div class="mode-tab" data-mode="zone"><span class="dot">📍</span>Zone</div>
  </div>

  <div id="content"></div>

  <div id="clean-bar">
    <button id="clean-btn" disabled>Clean</button>
  </div>

  <script type="module">
    const BASE = "{{ base }}";
    const $ = (id) => document.getElementById(id);

    let devices = [];
    let mapModule = null;
    let pollTimer = null;
    let lastDoc = null;
    let lastMapKey = null;
    let baseCanvas = null;
    let mode = "all";                  // room | all | zone
    let statusTimer = null;
    let currentDevice = null;          // {entity_id, state, name, did}
    let selectedRooms = [];            // room segment ids in click order
    let roomNames = {};                // segment id -> name

    // Work-mode codes for "actively cleaning / paused" (mirrors the integration).
    const MODE_CLEANING = new Set([2, 4, 5, 18, 19, 20, 21, 24, 25, 26, 27, 28, 29, 30]);
    const isCleaningState = (d) => {
      if (!d) return false;
      if (d.state === "cleaning") return true;
      const wm = d.work_mode;
      try { return MODE_CLEANING.has(parseInt(wm, 10)); } catch { return false; }
    };
    const isPausedState = (d) => {
      if (!d) return false;
      if (d.state === "paused") return true;
      try { return parseInt(d.work_mode, 10) === 1; } catch { return false; }
    };

    async function loadModule() {
      if (!mapModule) {
        mapModule = await import("/dreame_vacuum_unlocked_integration/map.js?v=10");
        await mapModule.loadSprites();
      }
      return mapModule;
    }

    // ---- mode tabs ----
    document.querySelectorAll(".mode-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        setMode(tab.dataset.mode);
      });
    });
    function setMode(m) {
      mode = m;
      document.querySelectorAll(".mode-tab").forEach((t) =>
        t.classList.toggle("active", t.dataset.mode === m));
      renderModeContent();
      updateCleanBar();
    }

    // ---- device load ----
    async function loadDevices() {
      const res = await fetch(`${BASE}/api/cleaning/devices`);
      const body = await res.json().catch(() => ({}));
      devices = body.devices || [];
      const select = $("device");
      if (!devices.length) {
        select.innerHTML = `<option value="">No devices registered yet</option>`;
        renderEmpty("No devices registered yet. Configure the Dreame vacuum integration first.");
        return;
      }
      select.innerHTML = devices.map((d) =>
        `<option value="${esc(d.did)}">${esc(d.name || d.did)}</option>`).join("");
      onDeviceChange(select.value);
    }

    function onDeviceChange(did) {
      currentDevice = devices.find((d) => d.did === did) || null;
      stopPolling();
      if (!currentDevice) { $("content").innerHTML = ""; updateCleanBar(); return; }
      loadMap(true);
      startStatusPolling();
    }
    $("device").addEventListener("change", (e) => onDeviceChange(e.target.value));
    $("refresh").addEventListener("click", () => loadMap(true));

    // ---- live status polling (keeps the Clean/Pause button truthful) ----
    function startStatusPolling() {
      stopStatusPolling();
      statusTimer = setTimeout(function tick() {
        pollStatus();
        statusTimer = setTimeout(tick, 2000);
      }, 2000);
    }
    function stopStatusPolling() { if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; } }

    async function pollStatus() {
      if (!currentDevice || !currentDevice.entity_id) return;
      try {
        const res = await fetch(`${BASE}/api/cleaning/devices`);
        const body = await res.json().catch(() => ({}));
        const fresh = (body.devices || []).find((d) => d.did === currentDevice.did);
        if (fresh) {
          if (!currentDevice.state) currentDevice.state = {};
          Object.assign(currentDevice.state, fresh.state || {});
          updateCleanBar();
        }
      } catch { /* transient - keep last known state */ }
    }

    // ---- shared Clean button ----
    async function callService(service, extra, domain = "vacuum") {
      const data = { entity_id: currentDevice.entity_id };
      Object.assign(data, extra || {});
      const res = await fetch(`${BASE}/api/service`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domain, service, data }),
      });
      return res.ok;
    }

    async function onCleanPressed() {
      if (!currentDevice || !currentDevice.entity_id) return;
      if (isCleaningState(currentDevice.state)) {
        await callService("pause");          // cleaning -> pause
      } else if (mode === "room" && selectedRooms.length) {
        // Room-targeted clean: send the selected room ids in the order they
        // were picked. The vacuum cleans them in that order.
        const rooms = selectedRooms.map((id) => parseInt(id, 10));
        await callService(
          "clean_rooms", { rooms },
          "dreame_vacuum_unlocked_integration"
        );
        selectedRooms = [];
        if (lastDoc) drawMap($("content"), lastDoc);
        drawRoomList($("content"));
      } else {
        await callService("start");          // All -> whole-house clean
      }
      // Re-read live state shortly after the command lands.
      setTimeout(pollStatus, 800);
    }
    $("clean-btn").addEventListener("click", onCleanPressed);

    function cleanLabel() {
      if (mode === "room" && selectedRooms.length) {
        return selectedRooms.length === 1 ? "Clean 1 room" : `Clean ${selectedRooms.length} rooms`;
      }
      if (mode === "zone") return "Clean zone";
      return "Clean";
    }

    function updateCleanBar() {
      const btn = $("clean-btn");
      const st = currentDevice?.state;
      if (!currentDevice || !currentDevice.entity_id) {
        btn.disabled = true; btn.textContent = "Clean"; btn.className = "";
        return;
      }
      if (isPausedState(st)) {
        btn.textContent = "Continue"; btn.disabled = false; btn.className = "paused";
      } else if (isCleaningState(st)) {
        btn.textContent = "Pause"; btn.disabled = false; btn.className = "busy";
      } else {
        btn.textContent = cleanLabel(); btn.disabled = false; btn.className = "";
      }
    }

    // ---- rendering ----
    function renderEmpty(msg) {
      $("content").innerHTML = `<p class="hint">${esc(msg)}</p>`;
    }

    function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }
    function startPolling() {
      stopPolling();
      pollTimer = setTimeout(function tick() {
        loadMap(false);
        pollTimer = setTimeout(tick, 2000);
      }, 2000);
    }

    async function loadMap(refresh) {
      const did = $("device").value;
      if (!did) return;
      const url = `${BASE}/api/maps/${encodeURIComponent(did)}/current${refresh ? "?refresh=1" : ""}`;
      const body = $("content");
      let res;
      try { res = await fetch(url); }
      catch { if (!refresh) return; body.innerHTML = `<p class="err">Could not reach Home Assistant.</p>`; return; }
      const doc = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (!refresh) return;
        body.innerHTML = `<p class="err">${esc(doc.error || "Could not load the map")}</p>`;
        return;
      }
      lastDoc = doc;
      roomNames = doc.room_names || {};
      startPolling();
      renderModeContent();
    }

    // Re-render just the tab-specific bits (map + room list) without refetching.
    function renderModeContent() {
      const body = $("content");
      const doc = lastDoc;
      if (!doc) { renderEmpty(currentDevice ? "Loading map..." : "No device selected."); return; }
      // Drop panels from any other mode so switching tabs doesn't stack them.
      ["#all-card", "#zone-card", "#room-panel", ".status-row"].forEach((sel) => {
        body.querySelectorAll(sel).forEach((el) => el.remove());
      });
      drawMap(body, doc);
      if (mode === "room") drawRoomList(body);
      else if (mode === "all") drawAllCard(body);
      else drawZoneCard(body);
      updateStatus(doc);
    }

    async function drawMap(body, doc) {
      const api = await loadModule();
      let decoded;
      try { decoded = api.decodeMap(doc); }
      catch (err) { body.innerHTML = `<p class="err">${esc(err.message || "Could not decode the map")}</p>`; return; }
      const scale = doc.suggested_scale || 5;
      const key = `${doc.map_id}|${doc.cells.join("x")}|${doc.origin.join(",")}`;

      let wrap = body.querySelector("#map-canvas-wrap");
      if (!wrap) {
        wrap = document.createElement("div"); wrap.id = "map-canvas-wrap";
        wrap.innerHTML = `<canvas id="view"></canvas>`;
        body.prepend(wrap);
      }
      const canvas = wrap.querySelector("canvas#view");
      const width = decoded.cols * scale;
      const height = decoded.rows * scale;
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width; canvas.height = height;
      }
      const ctx = canvas.getContext("2d");

      if (mode === "room") {
        // Room selection: recede unselected rooms, keep selected ones full
        // colour with an order-number bubble, and let taps toggle a room.
        api.drawRoomSelection(ctx, decoded, { scale, selectedOrder: selectedRooms });
        if (decoded.robot) {
          api.drawVacuum(ctx, decoded, { x: decoded.robot[0], y: decoded.robot[1], heading: decoded.angle }, { scale, opacity: 0.9 });
        }
        if (!canvas._roomClickBound) {
          canvas._roomClickBound = true;
          canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = (e.clientX - rect.left) * (canvas.width / rect.width);
            const py = (e.clientY - rect.top) * (canvas.height / rect.height);
            const room = api.roomAtPixel(decoded, px, py, scale);
            if (room != null) toggleRoom(String(room));
          });
        }
      } else {
        // All / Zone: cached static base layer + live robot (ghost-free).
        if (!baseCanvas || lastMapKey !== key) {
          lastMapKey = key;
          baseCanvas = document.createElement("canvas");
          baseCanvas.width = width;
          baseCanvas.height = height;
          const bctx = baseCanvas.getContext("2d");
          api.drawBase(bctx, decoded, { scale, showRoomNames: true });
          if (decoded.dock) {
            api.drawDock(bctx, decoded, { x: decoded.dock[0], y: decoded.dock[1], heading: decoded.dock_angle }, { scale });
          }
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(baseCanvas, 0, 0);
        if (decoded.robot) {
          api.drawVacuum(ctx, decoded, { x: decoded.robot[0], y: decoded.robot[1], heading: decoded.angle }, { scale });
        }
      }
    }

    // Room selection is the source of truth, shared by the map badges and the
    // chip list below. Toggling re-renders the map (so the order bubble moves)
    // and the chips together.
    function toggleRoom(id) {
      const i = selectedRooms.indexOf(id);
      if (i >= 0) { selectedRooms.splice(i, 1); }
      else { selectedRooms.push(id); }
      if (lastDoc) drawMap($("content"), lastDoc);
      drawRoomList($("content"));
      updateCleanBar();
    }
    function removeRoom(id) {
      selectedRooms = selectedRooms.filter((r) => r !== id);
      if (lastDoc) drawMap($("content"), lastDoc);
      drawRoomList($("content"));
      updateCleanBar();
    }

    function drawAllCard(body) {
      let c = body.querySelector("#all-card");
      if (!c) {
        c = document.createElement("div"); c.id = "all-card"; c.className = "card";
        c.style.marginTop = "10px";
        body.appendChild(c);
      }
      c.innerHTML = `<div style="font-weight:600">Clean whole house</div>
        <div class="hint" style="margin-top:2px">Press <b>Clean</b> below to start an automatic full-home clean.</div>`;
    }

    function drawZoneCard(body) {
      let c = body.querySelector("#zone-card");
      if (!c) {
        c = document.createElement("div"); c.id = "zone-card"; c.className = "card";
        c.style.marginTop = "10px";
        body.appendChild(c);
      }
      c.innerHTML = `<div style="font-weight:600">Zone cleaning</div>
        <div class="hint" style="margin-top:2px">Zone cleaning is coming in the next update.</div>`;
    }

    function drawRoomList(body) {
      let wrap = body.querySelector("#room-panel");
      if (!wrap) {
        wrap = document.createElement("div"); wrap.id = "room-panel";
        body.appendChild(wrap);
      }
      const ids = Object.keys(roomNames);
      if (!ids.length) {
        wrap.innerHTML = `<div class="hint" style="margin-top:10px">No named rooms on this map yet.</div>`;
        return;
      }
      const selected = new Set(selectedRooms);
      const chips = ids.map((id) => {
        const name = roomNames[id];
        const on = selected.has(id);
        const order = selectedRooms.indexOf(id) + 1;
        return `<div class="room-chip${on ? " selected" : ""}" data-id="${esc(id)}" data-name="${esc(name)}">
            ${esc(name)}${on ? ` · ${order}` : ""}</div>`;
      }).join("");
      const orderPills = selectedRooms.map((id) =>
        `<span class="order-pill">${esc(roomNames[id] || id)}<span class="x" data-id="${esc(id)}">×</span></span>`).join("");
      wrap.innerHTML = `
        <div style="font-weight:600;margin-top:10px">Select rooms (tap in order)</div>
        <div id="room-list">${chips}</div>
        <div id="room-order">${orderPills}</div>`;

      wrap.querySelectorAll(".room-chip").forEach((chip) => {
        chip.addEventListener("click", () => toggleRoom(chip.dataset.id));
      });
      wrap.querySelectorAll(".order-pill .x").forEach((x) => {
        x.addEventListener("click", (e) => { e.stopPropagation(); removeRoom(x.dataset.id); });
      });
    }

    function updateStatus(doc) {
      let row = $("content").querySelector(".status-row");
      if (!row) {
        row = document.createElement("div"); row.className = "status-row";
        $("content").appendChild(row);
      }
      const st = currentDevice?.state || {};
      const stateLabel = st.device_state || st.state || "unknown";
      const pillHtml = `<span class="pill mode-pill">${esc(stateLabel)}</span>`;
      row.innerHTML = `<span id="status-pill" class="pill"></span>${pillHtml}
        <span id="status-map">map ${doc.map_id} · ${Object.keys(roomNames).length} rooms</span>`;
      const hasRobot = !!(doc.robot && doc.robot.length);
      $("status-pill").textContent = hasRobot ? "robot on map" : "no robot on map";
      $("status-pill").className = "pill" + (hasRobot ? " on" : "");
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    loadDevices();
  </script>
  <script>
    (function () {
      var btn = document.getElementById("settings-btn");
      var menu = document.getElementById("settings-dropdown");
      if (!btn || !menu) return;
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var opening = menu.hidden;
        menu.hidden = !opening;
        btn.setAttribute("aria-expanded", String(opening));
      });
      document.addEventListener("click", function (e) {
        if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) {
          menu.hidden = true;
          btn.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>
</html>
