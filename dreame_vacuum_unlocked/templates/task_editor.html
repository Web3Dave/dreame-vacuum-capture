<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ task.name if task else "New task" }} - Dreame Companion</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
      --text: #1c1e21; --muted: #6b7280; --accent: #03a9f4; --ok: #2e7d32; --bad: #c62828;
      --tool: #ff9800;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1b1f24; --line:#2b3138; --text:#e8eaed; --muted:#9aa4b2; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 12px; background:var(--bg); color:var(--text);
           font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           overflow-x:hidden; }
    a.back { color:var(--muted); text-decoration:none; font-size:14px; }
    a.back:hover { color:var(--text); }
    button { font:inherit; font-size:14px; padding:7px 14px; border-radius:8px; cursor:pointer;
             border:1px solid var(--line); background:var(--card); color:var(--text); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button.ghost { background:transparent; }
    button.danger { color:var(--bad); border-color:var(--bad); }
    button:hover { filter:brightness(1.06); }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button[disabled] { opacity:.45; cursor:not-allowed; }
    input, select, textarea { font:inherit; font-size:14px; width:100%; padding:8px 10px;
      border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
    .hint { color:var(--muted); font-size:12px; margin:4px 0 0; }
    .err { color:var(--bad); font-size:13px; margin:0; }

    .ed-top { display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
    .ed-top h1 { font-size:18px; margin:0; font-weight:600; }
    .ed-top .spacer { flex:1; }

    .ed-meta { display:grid; grid-template-columns: minmax(220px, 1fr) minmax(180px, 280px);
               gap:10px 16px; margin-bottom:14px; max-width:760px; }
    .ed-meta label span { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    /* The id rides under the name it derives from - readable, quiet, editable. */
    #t-slug { opacity:.55; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
    #t-slug:focus { opacity:1; }

    .ed-grid { display:grid; grid-template-columns: 1fr 340px; gap:16px; align-items:start; }
    .pane { background:var(--card); border:1px solid var(--line); border-radius:12px; }

    .map-wrap { position:relative; background:rgba(127,127,127,.08);
                border-radius:12px 12px 0 0; min-height:200px; }
    .map-wrap canvas { width:100%; height:auto; display:block; border-radius:12px 12px 0 0; }
    .map-wrap canvas.armed { cursor:crosshair; }
    .map-note { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                text-align:center; padding:24px; }
    /* The class rule above would otherwise beat the browser's [hidden] rule,
       leaving an invisible overlay that swallows every click on the map. */
    .map-note[hidden] { display:none; }
    .map-note span { background:var(--card); border:1px solid var(--line); color:var(--muted);
                     padding:10px 16px; border-radius:10px; max-width:80%;
                     box-shadow:0 2px 10px rgba(0,0,0,.18); }

    .infobar { display:flex; align-items:center; gap:10px; padding:10px 14px;
               border-top:1px solid var(--line); min-height:52px; font-size:13.5px; }
    .infobar .values { flex:1; min-width:0; font-variant-numeric:tabular-nums; }
    .infobar .values.bad { color:var(--bad); }

    .toolbar { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line);
               flex-wrap:wrap; }
    .tool { display:inline-flex; align-items:center; gap:7px; }
    .tool svg { width:17px; height:17px; }
    .tool[aria-pressed="true"] { background:var(--tool); border-color:var(--tool); color:#fff; }

    .side-head { display:flex; align-items:center; gap:8px; padding:12px 14px;
                 border-bottom:1px solid var(--line); }
    .side-head strong { flex:1; font-size:14px; }
    .tabs { display:flex; gap:6px; }
    .tabs button { padding:4px 10px; font-size:13px; }
    .tabs button[aria-pressed="true"] { background:var(--text); color:var(--bg); border-color:var(--text); }
    .side-body { padding:10px; }
    .side-body textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px;
                          min-height:340px; white-space:pre; }

    .step-row { border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
                overflow:hidden; }
    .step-row > .row-head { display:flex; align-items:center; gap:10px; padding:9px 12px;
                cursor:pointer; user-select:none; }
    .step-row > .row-head:hover { background:rgba(127,127,127,.07); }
    .step-row.sel { border-color:var(--accent); }
    .step-row.sel > .row-head { background:rgba(3,169,244,.10); }
    .row-head svg { width:16px; height:16px; color:var(--muted); flex:none; }
    .step-row.sel .row-head svg { color:var(--accent); }
    .row-head .n { color:var(--muted); font-size:12px; width:16px; text-align:right; flex:none; }
    .row-head .what { flex:1; min-width:0; font-size:13.5px; overflow:hidden;
                      text-overflow:ellipsis; white-space:nowrap; }
    .row-more { padding:10px 12px 12px; border-top:1px solid var(--line); }
    .row-fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
    .row-fields label { font-size:12px; color:var(--muted); }
    .row-fields label span { display:block; margin-bottom:3px; }
    .row-fields input { padding:6px 8px; font-size:13px; }
    .row-fields .bool-view { display:flex; align-items:center; gap:8px;
                              min-height:34px; padding-top:4px; }
    .row-fields .bool-view span { margin:0; flex:1; }
    .row-fields .bool-view input[type="checkbox"] { width:auto; accent-color:var(--accent);
                                                     width:18px; height:18px; }
    .row-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
    .row-actions button { padding:4px 10px; font-size:12.5px; }
    .add-row { display:flex; gap:8px; margin-top:10px; }
    .add-row select { flex:1; }
    /* clean_rooms step: ordered-room selector */
    .room-editor { border:1px dashed var(--line); border-radius:8px; padding:8px; margin-bottom:10px; }
    .room-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .room-chip { padding:5px 11px; border-radius:999px; font-size:12.5px; font-weight:600;
                 background:var(--card); border:1px solid var(--line); color:var(--text);
                 cursor:pointer; user-select:none; }
    .room-chip.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
    .room-order-row { display:flex; align-items:center; gap:6px; padding:2px 0; font-size:13px; }
    .room-order-n { color:var(--accent); font-weight:700; width:16px; text-align:right; flex:none; }
    .room-order-row button { padding:2px 8px; font-size:12px; }

    /* if-classification step: nested branch editor */
    .ifc-editor { border:1px dashed var(--line); border-radius:8px; padding:10px; margin-bottom:10px;
                  background:rgba(127,127,127,.04); }
    .ifc-clf { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); margin-bottom:10px; }
    .ifc-clf select { font-size:13.5px; padding:6px 8px; }
    .ifc-case, .ifc-default { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; }
    .ifc-case-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
                     font-size:13px; margin-bottom:6px; }
    .ifc-case-head button { padding:2px 8px; font-size:11.5px; }
    .ifc-sublist { display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
    .ifc-step { border:1px solid var(--line); border-radius:8px; padding:7px 8px; }
    .ifc-step-head { display:flex; align-items:center; gap:8px; }
    .ifc-step-head svg { width:14px; height:14px; color:var(--muted); flex:none; }
    .ifc-step-head .n { color:var(--muted); font-size:11.5px; width:14px; text-align:right; flex:none; }
    .ifc-step-head .what { flex:1; min-width:0; font-size:12.5px; overflow:hidden;
                           text-overflow:ellipsis; white-space:nowrap; }
    .ifc-step-actions { display:flex; gap:4px; flex:none; }
    .ifc-step-actions button { padding:1px 7px; font-size:11.5px; }
    .ifc-nested { margin-top:8px; }
    .ifc-addmenu { display:flex; gap:6px; margin-top:2px; }
    .ifc-addmenu select { flex:1; font-size:12.5px; padding:4px 6px; }
    .ifc-addmenu button { padding:4px 10px; font-size:12.5px; }

    svg { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    /* Narrow screens: the two panes become tabs rather than a squeeze. */
    .ed-tabs { display:none; gap:6px; margin-bottom:12px; }
    @media (max-width: 900px) {
      .ed-grid { grid-template-columns: 1fr; }
      .ed-tabs { display:flex; }
      body.show-map .ed-side { display:none; }
      body.show-steps .ed-main { display:none; }
    }

    dialog { border:1px solid var(--line); border-radius:14px; background:var(--card);
             color:var(--text); padding:0; width:min(440px,94vw); }
    dialog::backdrop { background:rgba(0,0,0,.45); }
    .dlg-head, .dlg-foot { padding:14px 18px; display:flex; gap:10px; align-items:center; }
    .dlg-head { border-bottom:1px solid var(--line); }
    .dlg-foot { border-top:1px solid var(--line); justify-content:flex-end; }
    .dlg-body { padding:16px 18px; }
    .dlg-body label span { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }

    .settings-menu { position:relative; display:flex; align-items:center; }
    .settings-btn { border:none; background:transparent; color:var(--muted); cursor:pointer;
                    padding:6px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
    .settings-btn:hover { color:var(--text); background:rgba(127,127,127,.12); }
    .settings-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .settings-btn svg { width:19px; height:19px; fill:none; stroke:currentColor;
                        stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .settings-dropdown { position:fixed; top:72px; right:16px; background:var(--card);
                         border:1px solid var(--line); border-radius:8px;
                         box-shadow:0 6px 20px rgba(0,0,0,.18); min-width:200px; padding:4px; z-index:30; }
    .settings-dropdown a { display:block; padding:8px 10px; font-size:13.5px; color:var(--text);
                           text-decoration:none; border-radius:6px; }
    .settings-dropdown a:hover { background:rgba(127,127,127,.12); }
  </style>
</head>
<body class="show-map">
  <div class="ed-top">
    <a class="back" id="back" href="{{ base }}/tasks">&larr; Tasks</a>
    <h1 id="title">{{ "Edit task" if task else "New task" }}</h1>
    <span class="spacer"></span>
    <p class="err" id="top-err" hidden></p>
    <button type="button" class="primary" id="save-task">Save task</button>
    <div class="settings-menu">
      <button type="button" class="settings-btn" id="settings-btn" aria-haspopup="true" aria-expanded="false" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="settings-dropdown" id="settings-dropdown" hidden>
        <a href="{{ base }}/config">Config</a>
        <a href="{{ base }}/voice">Custom voice</a>
        <a href="{{ base }}/audio">Audio</a>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById("settings-btn");
      var menu = document.getElementById("settings-dropdown");
      if (!btn || !menu) return;
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var opening = menu.hidden;
        menu.hidden = !opening;
        btn.setAttribute("aria-expanded", String(opening));
      });
      document.addEventListener("click", function (e) {
        if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) {
          menu.hidden = true;
          btn.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>

  <div class="ed-meta">
    <label><span>Name</span>
      <input id="t-name" placeholder="My Task" autocomplete="off"></label>
    <label><span>Vacuum</span><select id="t-did"></select></label>
    <label><span>Id &mdash; what an automation calls</span>
      <input id="t-slug" autocomplete="off" spellcheck="false"></label>
  </div>

  <div class="ed-tabs tabs">
    <button type="button" data-pane="map" aria-pressed="true">Map</button>
    <button type="button" data-pane="steps" aria-pressed="false">Steps</button>
  </div>

  <div class="ed-grid">
    <div class="ed-main pane">
      <div class="map-wrap" id="map-wrap">
        <canvas id="map"></canvas>
        <div class="map-note" id="map-note"><span id="map-note-text">Loading map&hellip;</span></div>
      </div>
      <div class="infobar">
        <div class="values" id="info">Choose a tool, then click the map.</div>
        <button type="button" class="ghost" id="draft-cancel" hidden>Cancel</button>
        <button type="button" class="primary" id="draft-save" hidden>Save</button>
      </div>
      <div class="toolbar">
        <button type="button" class="tool" id="tool-location" aria-pressed="true"
                title="Add a go-to point">
          <svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Location</button>
        <button type="button" class="tool" id="tool-heading" aria-pressed="false"
                title="Set the heading at the last go-to point">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Heading</button>
        <button type="button" class="tool" id="tool-snapshot" aria-pressed="false"
                title="Take a snapshot at the last go-to point">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Snapshot</button>
        <button type="button" class="tool" id="tool-cleanrooms" aria-pressed="false"
                title="Clean a set of rooms, in the order you select them">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><polyline points="4 14 12 20 20 14"/><path d="M4 14c0-2 1-3 2-4M20 14c0-2-1-3-2-4"/></svg>
          Clean rooms</button>
        <button type="button" class="tool" id="tool-dock" title="Send the vacuum home">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Return to dock</button>
        <span style="flex:1"></span>
        <button type="button" class="ghost" id="map-refresh" title="Ask the vacuum for a fresh map">Refresh map</button>
      </div>
    </div>

    <div class="ed-side pane">
      <div class="side-head">
        <strong>Steps</strong>
        <div class="tabs">
          <button type="button" data-view="steps" aria-pressed="true">Steps</button>
          <button type="button" data-view="yaml" aria-pressed="false">YAML</button>
        </div>
      </div>
      <div class="side-body" id="side-steps">
        <div id="step-list"></div>
        <div class="add-row">
          <select id="add-type"></select>
          <button type="button" id="add-step">Add</button>
        </div>
      </div>
      <div class="side-body" id="side-yaml" hidden>
        <p class="hint" style="margin:0 0 8px">The steps as YAML. Edits here apply when you save.</p>
        <textarea id="t-yaml" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <dialog id="tagger">
    <div class="dlg-head"><strong style="flex:1">Snapshot tag</strong></div>
    <div class="dlg-body">
      <label><span>Tag &mdash; groups the photos this task takes</span>
        <select id="tag-pick"></select></label>
      <p class="hint" id="tag-id"></p>
      <div id="tag-new-wrap" hidden style="margin-top:10px">
        <label><span>New tag name</span>
          <input id="tag-new" placeholder="Front door" autocomplete="off"></label>
        <p class="hint" id="tag-new-id"></p>
      </div>
      <p class="err" id="tag-err" hidden></p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="ghost" id="tag-cancel">Cancel</button>
      <button type="button" class="primary" id="tag-save">Save</button>
    </div>
  </dialog>

  <script>
    const BASE = "{{ base }}";
    const ADDON_VERSION = "{{ addon_version }}";
    const TASK = {{ task | tojson }};

    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? "").replace(/[&<>"]/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c] || c));

    // Icons for the step list, keyed by step type.
    const ICONS = {
      go_to_point: '<svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      rotate_to_heading: '<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',
      take_snapshot: '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
      return_to_dock: '<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      record_clip: '<svg viewBox="0 0 24 24"><rect x="1" y="5" width="15" height="14" rx="2"/><polygon points="23 7 16 12 23 17 23 7"/><circle cx="8" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg>',
      end_clip: '<svg viewBox="0 0 24 24"><rect x="1" y="5" width="15" height="14" rx="2"/><polygon points="23 7 16 12 23 17 23 7"/><rect x="5.5" y="9.5" width="5" height="5" rx="1" fill="currentColor" stroke="none"/></svg>',
      clean_rooms: '<svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><polyline points="4 14 12 20 20 14"/><path d="M4 14c0-2 1-3 2-4M20 14c0-2-1-3-2-4"/></svg>',
      if_classification: '<svg viewBox="0 0 24 24"><path d="M12 2 L20 13 L12 22 L4 13 Z"/><line x1="12" y1="13" x2="12" y2="22"/></svg>',
      play_audio: '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8 8 0 0 1 0 12"/></svg>',
    };

    let schema = {}, devices = [], tags = [], classifiers = [], audioFiles = [];
    let stepsState = TASK ? JSON.parse(JSON.stringify(TASK.steps)) : [];
    let selIndex = -1;             // selected step, -1 for none
    let tool = "location";
    let draft = null;              // {kind, point?, heading?, editIndex?}
    let sideView = "steps";
    let dirty = false;
    let slugTouched = !!TASK;      // an existing id never auto-changes with the name
    let mapApi = null, mapDoc = null, scale = 5, dragging = false;

    // ---- name / id -------------------------------------------------------
    // The id rule: lowercase letters, digits, underscores. Applied as you
    // type so the field can never hold a character the server would reject.
    const idChars = v => v.toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "");
    const finishedId = v => idChars(v).replace(/_+/g, "_").replace(/^_+|_+$/g, "").slice(0, 48);

    $("t-name").addEventListener("input", () => {
      dirty = true;
      if (!slugTouched) $("t-slug").value = finishedId($("t-name").value);
    });
    $("t-slug").addEventListener("input", () => {
      dirty = true; slugTouched = true;
      const el = $("t-slug");
      const at = el.selectionStart;
      const before = el.value;
      el.value = idChars(before);
      // Keep the caret where it was, minus whatever was stripped before it.
      const removed = before.slice(0, at).length - idChars(before.slice(0, at)).length;
      el.setSelectionRange(at - removed, at - removed);
    });

    // ---- boot ------------------------------------------------------------
    async function boot() {
      const res = await fetch(`${BASE}/api/tasks`);
      const body = await res.json();
      schema = body.step_types; devices = body.devices;
      $("t-did").innerHTML = devices.map(d =>
        `<option value="${esc(d.did)}"${TASK && TASK.did === d.did ? " selected" : ""}>${esc(d.name)}</option>`).join("");
      // Every step type, not just the ones the toolbar lacks: the menu is
      // the keyboard-and-numbers alternative to the map for people who know
      // their coordinates, not a remainder bin.
      $("add-type").innerHTML = Object.entries(schema)
        .map(([k, v]) => `<option value="${esc(k)}">${esc(v.label)}</option>`).join("");
      if (TASK) { $("t-name").value = TASK.name; $("t-slug").value = TASK.slug; }
      await refreshTags();
      try {
        const cres = await fetch(`${BASE}/api/classifications`);
        classifiers = ((await cres.json()).classifications || []).filter(c => c.configured);
      } catch { classifiers = []; }
      try {
        const ares = await fetch(`${BASE}/api/audio`);
        audioFiles = ((await ares.json()).files || []).filter(f => f.toLowerCase().endsWith(".mp3"));
      } catch { audioFiles = []; }
      renderSteps();
      await loadMap(false);
    }

    async function refreshTags() {
      try {
        const res = await fetch(`${BASE}/api/tags`);
        tags = (await res.json()).tags || [];
      } catch { tags = []; }
    }
    const tagName = id => (tags.find(t => t.id === id) || {}).name || id;

    // ---- map -------------------------------------------------------------
    async function mapModule() {
      if (!mapApi) {
        mapApi = await import(`/dreame_vacuum_unlocked_integration/map.js?v=${ADDON_VERSION}`);
        if (mapApi.loadSprites) await mapApi.loadSprites();
      }
      return mapApi;
    }

    async function loadMap(refresh) {
      const did = $("t-did").value;
      if (!did) return mapNote("Choose a vacuum first.");
      mapNote(refresh ? "Asking the vacuum for a fresh map…" : "Loading map…");
      const res = await fetch(`${BASE}/api/map/${did}${refresh ? "?refresh=1" : ""}`);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return mapNote(body.error || "No map available yet - try Refresh map.");
      const docRes = await fetch(`${BASE}/map/${did}/document?v=${body.meta.updated_at || Date.now()}`);
      if (!docRes.ok) return mapNote("This map was published by an older integration - update it and press Refresh map.");
      try {
        const api = await mapModule();
        if (!api.drawHeadingHandle) {
          return mapNote("The integration is serving an older map renderer - update it and restart Home Assistant.");
        }
        mapDoc = api.decodeMap(await docRes.json());
      } catch (err) {
        return mapNote(`Could not read the map: ${err.message}`);
      }
      $("map-note").hidden = true;
      draw();
      syncTools();
      updateInfo();
    }

    function mapNote(text) {
      $("map-note").hidden = false;
      $("map-note-text").textContent = text;
    }

    /**
     * Where the vacuum would be after steps 0..upto (inclusive).
     *
     * The editor's whole spatial model: a heading edit or a snapshot preview
     * happens at the last go-to point before it, or at the dock after a
     * return_to_dock, or - before any movement step - wherever the robot
     * actually is on the published map.
     */
    function contextPose(upto) {
      let pose = {
        x: mapDoc?.robot?.[0] ?? null, y: mapDoc?.robot?.[1] ?? null,
        heading: mapDoc?.angle ?? null, hasPoint: false,
      };
      for (let i = 0; i <= upto && i < stepsState.length; i++) {
        const s = stepsState[i];
        if (s.type === "go_to_point" && s.x !== undefined && s.y !== undefined) {
          pose = {x: Number(s.x), y: Number(s.y), heading: null, hasPoint: true};
        } else if (s.type === "rotate_to_heading" && s.heading !== undefined) {
          pose.heading = Number(s.heading);
        } else if (s.type === "return_to_dock" && mapDoc?.dock) {
          pose = {x: mapDoc.dock[0], y: mapDoc.dock[1],
                  heading: mapDoc.dock_angle ?? null, hasPoint: false};
        }
      }
      return pose;
    }

    function draw() {
      if (!mapDoc || !mapApi) return;
      const canvas = $("map");
      const width = $("map-wrap").clientWidth;
      scale = mapApi.fitScale ? mapApi.fitScale(mapDoc, width, {dpr: window.devicePixelRatio || 1})
                              : (mapDoc.suggested_scale || 5);
      if (canvas.width !== mapDoc.cols * scale) {
        canvas.width = mapDoc.cols * scale;
        canvas.height = mapDoc.rows * scale;
      }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      mapApi.drawBase(ctx, mapDoc, {scale});
      if (mapDoc.dock) {
        mapApi.drawDock(ctx, mapDoc, {x: mapDoc.dock[0], y: mapDoc.dock[1],
                                      heading: mapDoc.dock_angle}, {scale});
      }
      if (mapDoc.robot) {
        mapApi.drawVacuum(ctx, mapDoc, {x: mapDoc.robot[0], y: mapDoc.robot[1],
                                        heading: mapDoc.angle}, {scale, fov: 0});
      }

      if (draft) return drawDraft(ctx);
      if (selIndex >= 0) drawSelected(ctx);
    }

    function drawDraft(ctx) {
      if (draft.kind === "location" && draft.point) {
        mapApi.drawTarget(ctx, mapDoc, draft.point, {scale});
      } else if (draft.kind === "heading") {
        const pose = {...draft.base, heading: draft.heading};
        mapApi.drawVacuum(ctx, mapDoc, pose, {scale, fov: 70, opacity: .85});
        mapApi.drawHeadingHandle(ctx, mapDoc, pose, {scale});
      } else if (draft.kind === "rooms") {
        mapApi.drawRoomSelection(ctx, mapDoc, {scale, selectedOrder: draft.rooms});
      }
    }

    /**
     * The selected step, staged where it will actually happen: its indicator
     * is drawn at the pose the steps before it lead to.
     */
    function drawSelected(ctx) {
      const step = stepsState[selIndex];
      if (!step) return;
      if (step.type === "go_to_point" && step.x !== undefined) {
        mapApi.drawTarget(ctx, mapDoc, {x: Number(step.x), y: Number(step.y)}, {scale});
      } else if (step.type === "rotate_to_heading" && step.heading !== undefined) {
        const pose = contextPose(selIndex - 1);
        if (pose.x == null) return;
        mapApi.drawVacuum(ctx, mapDoc, {...pose, heading: Number(step.heading)},
                          {scale, fov: 70, opacity: .8});
      } else if (step.type === "take_snapshot") {
        const pose = contextPose(selIndex);
        if (pose.x == null) return;
        mapApi.drawVacuum(ctx, mapDoc, pose, {scale, fov: 70, opacity: .8});
        mapApi.drawCameraBadge(ctx, mapDoc, pose, {scale});
      } else if (step.type === "return_to_dock" && mapDoc.dock) {
        mapApi.drawTarget(ctx, mapDoc, {x: mapDoc.dock[0], y: mapDoc.dock[1]}, {scale});
      }
    }

    // ---- info bar --------------------------------------------------------
    function updateInfo(text, bad) {
      const info = $("info");
      info.classList.toggle("bad", !!bad);
      $("draft-save").hidden = $("draft-cancel").hidden = !draft;
      if (text !== undefined) { info.textContent = text; return; }
      if (draft) {
        if (draft.kind === "location") {
          info.textContent = draft.point
            ? draftPointLabel() : "Click the map to choose the point.";
          $("draft-save").disabled = !draft.point;
        } else if (draft.kind === "heading") {
          info.textContent = `heading ${draft.heading}° - drag the handle to aim the vacuum`;
          $("draft-save").disabled = false;
        } else if (draft.kind === "rooms") {
          $("draft-save").disabled = !draft.rooms.length;
          if (!draft.rooms.length) {
            info.textContent = "Tap rooms on the map to add them - each tap appends to the order.";
          } else {
            const names = draft.rooms.map(r => roomName(r)).join(", ");
            info.textContent = `${draft.rooms.length} room${draft.rooms.length === 1 ? "" : "s"} in order: ${names}`;
          }
        }
      } else if (selIndex >= 0 && stepsState[selIndex]) {
        info.textContent = `Step ${selIndex + 1}: ${describe(stepsState[selIndex])}`;
      } else {
        info.textContent = "Choose a tool, then click the map.";
      }
    }

    function draftPointLabel() {
      const where = mapApi.describePoint(mapDoc, draft.point.x, draft.point.y);
      return `x ${draft.point.x}, y ${draft.point.y} (millimetres) in ${where.name}`;
    }

    // ---- tools -----------------------------------------------------------
    /**
     * Heading and snapshot only mean something somewhere: at a go-to point at
     * or before the selection. Without one they stay disabled - and location
     * is the default tool for the same reason it is first in a task.
     */
    function syncTools() {
      const anchored = contextPose(selIndex >= 0 ? selIndex : stepsState.length - 1).hasPoint;
      $("tool-heading").disabled = !anchored;
      $("tool-snapshot").disabled = !anchored;
      const locating = draft ? draft.kind === "location" : tool === "location";
      $("tool-location").setAttribute("aria-pressed", String(!!locating));
      $("tool-heading").setAttribute("aria-pressed", String(!!draft && draft.kind === "heading"));
      $("tool-cleanrooms").setAttribute("aria-pressed", String(!!draft && draft.kind === "rooms"));
      $("map").classList.toggle("armed", tool === "location" || !!draft);
    }

    function armLocation(editIndex, point) {
      draft = {kind: "location", point: point || null,
               editIndex: editIndex ?? null};
      tool = "location";
      syncTools(); updateInfo(); draw();
    }

    function armHeading(editIndex, heading) {
      const upto = editIndex != null ? editIndex - 1
                : (selIndex >= 0 ? selIndex : stepsState.length - 1);
      const base = contextPose(upto);
      if (base.x == null) return;
      draft = {kind: "heading", base,
               heading: heading ?? (base.heading != null ? Math.round(base.heading) : 0),
               editIndex: editIndex ?? null};
      syncTools(); updateInfo(); draw();
    }

    /** Map a room id to its name (the renderer knows the labels). */
    function roomName(id) {
      if (mapApi && mapDoc) {
        const n = (mapDoc.room_names || {})[id];
        if (n) return n;
      }
      return `Room ${id}`;
    }

    function armRooms(editIndex, rooms) {
      draft = {kind: "rooms",
               rooms: Array.isArray(rooms) ? rooms.slice() : [],
               editIndex: editIndex ?? null};
      tool = "rooms";
      syncTools(); updateInfo(); draw();
    }

    function toggleDraftRoom(id) {
      if (!draft || draft.kind !== "rooms") return;
      const i = draft.rooms.indexOf(id);
      if (i >= 0) draft.rooms.splice(i, 1);
      else draft.rooms.push(id);
      updateInfo(); draw();
    }

    function cancelDraft() {
      draft = null; dragging = false;
      syncTools(); updateInfo(); draw();
    }

    /**
     * A saved draft becomes a step: in place when it was editing one, else
     * inserted after the selected step so "add from here" is the default.
     */
    function saveDraft() {
      if (!draft) return;
      let step;
      if (draft.kind === "location") {
        if (!draft.point) return;
        step = {type: "go_to_point", x: draft.point.x, y: draft.point.y};
      } else if (draft.kind === "heading") {
        step = {type: "rotate_to_heading", heading: draft.heading};
      } else if (draft.kind === "rooms") {
        if (!draft.rooms.length) return;
        // The existing step may carry a "times" value the map editor shouldn't
        // overwrite - preserve it, only the rooms list changes here.
        const existing = draft.editIndex != null ? stepsState[draft.editIndex] : null;
        step = {type: "clean_rooms", rooms: draft.rooms.slice()};
        if (existing && existing.times !== undefined) step.times = existing.times;
        else step.times = 1;
      } else return;
      commitStep(step, draft.editIndex);
      draft = null;
      syncTools(); updateInfo(); draw();
    }

    function commitStep(step, editIndex) {
      dirty = true;
      if (editIndex != null) {
        stepsState[editIndex] = {...stepsState[editIndex], ...step};
        selIndex = editIndex;
      } else {
        const at = selIndex >= 0 ? selIndex + 1 : stepsState.length;
        stepsState.splice(at, 0, step);
        selIndex = at;
      }
      renderSteps();
    }

    // ---- map input -------------------------------------------------------
    function canvasPoint(event) {
      const canvas = $("map");
      const rect = canvas.getBoundingClientRect();
      const ratio = canvas.width / rect.width;
      return mapApi.pixelToWorld(
        mapDoc, (event.clientX - rect.left) * ratio,
        (event.clientY - rect.top) * ratio, scale);
    }

    $("map").addEventListener("pointerdown", event => {
      if (!mapDoc || !draft || draft.kind !== "heading") return;
      // Any drag on the map aims the vacuum - the knob is the affordance,
      // not the only grabbable pixel, which matters on a phone.
      dragging = true;
      $("map").setPointerCapture(event.pointerId);
      aimAt(event);
    });
    $("map").addEventListener("pointermove", event => { if (dragging) aimAt(event); });
    $("map").addEventListener("pointerup", () => { dragging = false; });

    function aimAt(event) {
      const world = canvasPoint(event);
      draft.heading = mapApi.headingFromPoints(draft.base, world);
      updateInfo(); draw();
    }

    $("map").addEventListener("click", event => {
      if (!mapDoc) return;
      if (draft && draft.kind === "rooms") {
        const rect = $("map").getBoundingClientRect();
        const ratio = $("map").width / rect.width;
        const room = mapApi.roomAtPixel(mapDoc,
          (event.clientX - rect.left) * ratio, (event.clientY - rect.top) * ratio, scale);
        if (room != null) toggleDraftRoom(room);
        return;
      }
      if (draft && draft.kind !== "location") return;
      if (tool !== "location" && !draft) return;
      const point = canvasPoint(event);
      const where = mapApi.describePoint(mapDoc, point.x, point.y);
      if (!where.ok) {
        updateInfo(`That is ${where.reason} - pick a spot on the floor.`, true);
        return;
      }
      if (!draft) draft = {kind: "location", point: null, editIndex: null};
      draft.point = point;
      syncTools(); updateInfo(); draw();
    });

    // ---- steps list ------------------------------------------------------
    function describe(step) {
      const spec = schema[step.type] || {};
      if (step.type === "if_classification") {
        const c = classifiers.find(x => x.id === step.classifier);
        const n = Object.keys(step.cases || {}).length;
        return `If ${c ? c.name : ("classification " + step.classifier)} (${n} case${n === 1 ? "" : "s"})`;
      }
      if (step.type === "go_to_point" && step.x !== undefined)
        return `Go to x ${step.x}, y ${step.y}`;
      if (step.type === "rotate_to_heading" && step.heading !== undefined)
        return `Face ${step.heading}°`;
      if (step.type === "take_snapshot")
        return `Snapshot – ${tagName(step.tag || "general")}`;
      if (step.type === "record_clip")
        return `Record clip – ${tagName(step.tag || "general")}`;
      if (step.type === "end_clip")
        return "End clip";
      if (step.type === "clean_rooms" && Array.isArray(step.rooms) && step.rooms.length) {
        const names = step.rooms.map(r => roomName(r)).join(" → ");
        const times = step.times > 1 ? `, ×${step.times}` : "";
        return `Clean rooms: ${names}${times}`;
      }
      return spec.label || step.type;
    }

    // Render one field's control: a switch for bools, a dropdown of uploaded
    // clips for play_audio's filename, else a text input. `attrs` carries the
    // addressing attributes (data-step for top-level, data-bpath+data-bidx for
    // nested); shared so top-level and nested steps render identically.
    function fieldCtrl(step, f, attrs, idx) {
      if (f.type === "bool") {
        const on = !!step[f.name];
        return `<label class="bool-view"><span>${esc(f.name)}</span>
          <input type="checkbox" role="switch" ${attrs} data-bool="1" data-field="${esc(f.name)}" title="${esc(f.help)}" ${on ? "checked" : ""}></label>`;
      }
      if (step.type === "play_audio" && f.name === "filename") {
        const chosen = step[f.name] || "";
        const known = audioFiles.includes(chosen);
        return `<label><span>${esc(f.name)}${f.required ? " *" : ""}</span>
          <select ${attrs} data-bidx="${idx}" data-field="filename" title="${esc(f.help)}">
            ${chosen && !known ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (missing)</option>` : ""}
            ${audioFiles.map(a => `<option value="${esc(a)}"${a === chosen ? " selected" : ""}>${esc(a)}</option>`).join("")}
          </select></label>`;
      }
      return `<label><span>${esc(f.name)}${f.required ? " *" : ""}</span>
        <input ${attrs} data-field="${esc(f.name)}" value="${esc(step[f.name] ?? "")}"
               placeholder="${esc(f.default ?? "")}" title="${esc(f.help)}"></label>`;
    }

    function renderSteps() {
      const rows = stepsState.map((step, i) => {
        const sel = i === selIndex;
        const spec = schema[step.type] || {fields: []};
        // The rooms list gets its own selector UI (multi-select + ordering),
        // not a plain text input, so drop it from the generic text fields.
        const roomFields = spec.fields || [];
        const textFields = step.type === "clean_rooms"
          ? roomFields.filter(f => f.name !== "rooms")
          : (step.type === "if_classification" ? [] : roomFields);
        const ifcEditor = (sel && step.type === "if_classification")
          ? renderIfClassEditor(step, [i]) : "";
        const fields = sel ? textFields.map(f =>
          fieldCtrl(step, f, `data-step="${i}"`, "")).join("") : "";
        const mapEdit = {go_to_point: "Edit on map", rotate_to_heading: "Adjust heading",
                         take_snapshot: "Change tag", clean_rooms: "Pick rooms on map"}[step.type];
        const roomEditor = (sel && step.type === "clean_rooms")
          ? renderRoomsEditor(step, i) : "";
        return `<div class="step-row${sel ? " sel" : ""}" data-row="${i}">
          <div class="row-head" data-selrow="${i}">
            <span class="n">${i + 1}</span>
            ${ICONS[step.type] || ""}
            <span class="what">${esc(describe(step))}</span>
          </div>
          ${sel ? `<div class="row-more">
            ${ifcEditor}
            ${roomEditor}
            ${fields ? `<div class="row-fields">${fields}</div>` : ""}
            <div class="row-actions">
              ${mapEdit ? `<button type="button" data-mapedit="${i}">${mapEdit}</button>` : ""}
              <button type="button" data-up="${i}" ${i === 0 ? "disabled" : ""}>&uarr;</button>
              <button type="button" data-down="${i}" ${i === stepsState.length - 1 ? "disabled" : ""}>&darr;</button>
              <button type="button" class="danger" data-rm="${i}">Remove</button>
            </div>
          </div>` : ""}
        </div>`;
      }).join("");
      $("step-list").innerHTML = rows ||
        `<p class="hint" style="margin:4px">No steps yet. Click the map to add the first go-to point.</p>`;
      syncTools(); updateInfo(); draw();
    }

    /**
     * The ordered room list for a clean_rooms step: every room that exists on
     * the map as a toggleable chip (tap to add to the end of the order or remove
     * it), plus up/down/remove on each chosen row so the order can be fixed.
     */
    function renderRoomsEditor(step, i) {
      const chosen = (step.rooms || []).slice();
      const all = Object.keys(mapDoc?.room_names || {}).map(Number).filter(n =>
        !Number.isNaN(n));
      const chosenNames = chosen.map(r => esc(roomName(r))).join(" → ");
      const chips = all.map(r => {
        const on = chosen.includes(r);
        return `<span class="room-chip${on ? " sel" : ""}" data-room-chosen="${i}" data-room="${r}"
                     style="cursor:pointer">${esc(roomName(r))}</span>`;
      }).join("");
      const orderRows = chosen.map((r, idx) => `
        <div class="room-order-row">
          <span class="room-order-n">${idx + 1}</span>
          <span class="room-order-name" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(roomName(r))}</span>
          <button type="button" data-room-up="${i}" data-room="${r}" ${idx === 0 ? "disabled" : ""}>&uarr;</button>
          <button type="button" data-room-down="${i}" data-room="${r}" ${idx === chosen.length - 1 ? "disabled" : ""}>&darr;</button>
          <button type="button" class="danger" data-room-rm="${i}" data-room="${r}">×</button>
        </div>`).join("");
      return `
        <div class="room-editor" style="margin-bottom:10px">
          <div style="font-size:12px;color:var(--muted);margin-bottom:4px">
            Rooms in order: ${chosen.length ? `<b>${chosenNames}</b>` : "none selected"}</div>
          <div style="font-size:12px;color:var(--muted);margin:4px 0">Tap a room to add / remove it:</div>
          <div class="room-chips">${chips}</div>
          ${chosen.length ? `<div style="font-size:12px;color:var(--muted);margin:6px 0 2px">Order (use arrows to change):</div>
            <div class="room-order">${orderRows}</div>` : ""}
        </div>`;
    }

    // ---- nested if-classification editor --------------------------------
    // A branch addresses a step by a path through stepsState, e.g.
    // [2, "cases", "dog", 0] = stepsState[2].cases.dog[0]. The top-level
    // editor still uses plain integer indices (data-step); only steps that
    // live inside a conditional carry an explicit path (data-bpath/-bidx).
    function resolvePath(segments) {
      let node = stepsState;
      for (const s of segments) node = node[s];
      return node;
    }
    const enc = v => JSON.stringify(v);

    function renderIfClassEditor(step, ref) {
      if (!classifiers.length) {
        return `<div class="ifc-editor" data-ref="${esc(enc(ref))}">
          <p class="hint" style="margin:4px 0">No configured classifications yet.
          Create and train one on the Classifications tab first, and link its
          tag to a snapshot step above this one.</p></div>`;
      }
      const clf = classifiers.find(c => c.id === step.classifier) || classifiers[0];
      // Keep only cases for the current classifier's classes; anything already
      // built under a label the classifier no longer has is allowed to go.
      step.classifier = clf.id;
      const fresh = {};
      for (const cls of clf.classes) fresh[cls] = (step.cases && step.cases[cls]) || [];
      step.cases = fresh;
      if (!Array.isArray(step.default)) step.default = [];
      const clfRef = enc(ref);
      const caseRows = clf.classes.map(cls => {
        const pj = enc(ref.concat(["cases", cls]));
        return `<div class="ifc-case">
          <div class="ifc-case-head"><b>if result == &ldquo;${esc(cls)}&rdquo;</b>
            <button type="button" class="danger" data-ifc-clear="${esc(clfRef)}" data-label="${esc(cls)}">clear</button></div>
          <div class="ifc-sublist">${renderBranchRows(ref, ["cases", cls])}</div>
          <div class="ifc-addmenu">
            <select data-ifc-newtype="${esc(pj)}">${typeOptions()}</select>
            <button type="button" data-ifc-add="${esc(pj)}">+ Add step</button>
          </div>
        </div>`;
      }).join("");
      const defaultPj = enc(ref.concat(["default"]));
      return `<div class="ifc-editor" data-ref="${esc(clfRef)}">
        <label class="ifc-clf"><span>Classification</span>
          <select data-ifc-clf="${esc(clfRef)}">
            ${classifiers.map(c => `<option value="${esc(c.id)}"${c.id === clf.id ? " selected" : ""}>${esc(c.name)}</option>`).join("")}
          </select>
        </label>
        <div class="ifc-cases">${caseRows}</div>
        <div class="ifc-default">
          <div class="ifc-case-head"><b>else (no case matches)</b></div>
          <div class="ifc-sublist">${renderBranchRows(ref, ["default"])}</div>
          <div class="ifc-addmenu">
            <select data-ifc-newtype="${esc(defaultPj)}">${typeOptions()}</select>
            <button type="button" data-ifc-add="${esc(defaultPj)}">+ Add step</button>
          </div>
        </div>
      </div>`;
    }

    function typeOptions() {
      return Object.entries(schema)
        .map(([k, v]) => `<option value="${esc(k)}">${esc(v.label)}</option>`).join("");
    }

    function renderBranchRows(ref, branchPath) {
      const parent = resolvePath(ref.concat(branchPath));
      const pj = enc(ref.concat(branchPath));
      const rows = parent.map((step, k) => {
        const spec = schema[step.type] || {fields: []};
        const fields = (spec.fields || []).filter(f => f.name !== "rooms")
          .map(f => fieldCtrl(step, f, `data-bpath="${esc(pj)}" data-bidx="${k}"`, k)).join("");
        const nested = step.type === "if_classification"
          ? renderIfClassEditor(step, ref.concat(branchPath).concat(k)) : "";
        return `<div class="ifc-step">
          <div class="ifc-step-head">
            <span class="n">${k + 1}</span>
            ${ICONS[step.type] || ""}
            <span class="what">${esc(describe(step))}</span>
            <span class="ifc-step-actions">
              <button type="button" data-bpath="${esc(pj)}" data-bidx="${k}" data-bup="1" ${k === 0 ? "disabled" : ""}>&uarr;</button>
              <button type="button" data-bpath="${esc(pj)}" data-bidx="${k}" data-bdown="1" ${k === parent.length - 1 ? "disabled" : ""}>&darr;</button>
              <button type="button" class="danger" data-bpath="${esc(pj)}" data-bidx="${k}" data-brm="1">×</button>
            </span>
          </div>
          ${nested ? `<div class="ifc-nested">${nested}</div>` : (fields ? `<div class="row-fields">${fields}</div>` : "")}
        </div>`;
      }).join("");
      return rows || `<span class="hint" style="margin:2px 0">(no steps yet)</span>`;
    }

    function collectFromUi() {
      for (const input of document.querySelectorAll(
        "#step-list input[data-step], #step-list select[data-step]")) {
        const step = stepsState[Number(input.dataset.step)];
        if (!step) continue;
        if (input.dataset.bool !== undefined) {
          // A left-off checkbox means "off" (the false default), so delete the
          // key: empty means "use the default", which keeps the YAML honest.
          if (input.checked) step[input.dataset.field] = true;
          else delete step[input.dataset.field];
          continue;
        }
        const value = input.value.trim();
        if (value === "") delete step[input.dataset.field];
        else step[input.dataset.field] = value;
      }
      // Nested steps inside if-classification branches, addressed by path.
      for (const input of document.querySelectorAll(
        "#step-list input[data-bpath], #step-list select[data-bpath]")) {
        let list;
        try { list = resolvePath(JSON.parse(input.dataset.bpath)); }
        catch { continue; }
        const step = list[Number(input.dataset.bidx)];
        if (!step) continue;
        if (input.dataset.bool !== undefined) {
          if (input.checked) step[input.dataset.field] = true;
          else delete step[input.dataset.field];
          continue;
        }
        const value = input.value.trim();
        if (value === "") delete step[input.dataset.field];
        else step[input.dataset.field] = value;
      }
      return stepsState;
    }

    $("step-list").addEventListener("input", () => { dirty = true; collectFromUi(); draw(); });
    $("step-list").addEventListener("change", e => {
      if (e.target.dataset.ifcClf === undefined) return;
      let ref;
      try { ref = JSON.parse(e.target.dataset.ifcClf); } catch { return; }
      const step = resolvePath(ref);
      if (!step || step.type !== "if_classification") return;
      step.classifier = e.target.value;
      const clf = classifiers.find(c => c.id === e.target.value);
      const fresh = {};
      for (const cls of (clf ? clf.classes : [])) {
        fresh[cls] = (step.cases && step.cases[cls]) || [];
      }
      step.cases = fresh;
      dirty = true; renderSteps();
    });

    function selectStep(i) {
      if (draft) cancelDraft();
      selIndex = selIndex === i ? -1 : i;   // clicking again deselects
      renderSteps();
    }

    // ---- snapshot tags ---------------------------------------------------
    let tagEditIndex = null;

    async function openTagger(editIndex) {
      tagEditIndex = editIndex ?? null;
      await refreshTags();
      const current = editIndex != null ? (stepsState[editIndex].tag || "general") : null;
      const known = tags.some(t => t.id === current);
      $("tag-pick").innerHTML = [
        ...(current && !known
          ? [`<option value="${esc(current)}" selected>${esc(current)} (current)</option>`] : []),
        ...tags.map(t =>
          `<option value="${esc(t.id)}"${t.id === current ? " selected" : ""}>${esc(t.name)}</option>`),
        `<option value="__new__">Create new tag…</option>`,
      ].join("");
      $("tag-new").value = "";
      $("tag-err").hidden = true;
      tagPickChanged();
      $("tagger").showModal();
    }

    function tagPickChanged() {
      const isNew = $("tag-pick").value === "__new__";
      $("tag-new-wrap").hidden = !isNew;
      $("tag-id").textContent = isNew ? "" : `id: ${$("tag-pick").value}`;
      if (isNew) tagNewChanged();
    }
    function tagNewChanged() {
      const id = finishedId($("tag-new").value);
      $("tag-new-id").textContent = id ? `id: ${id}` : "";
    }
    $("tag-pick").addEventListener("change", tagPickChanged);
    $("tag-new").addEventListener("input", tagNewChanged);

    async function saveTag() {
      let tagId = $("tag-pick").value;
      if (tagId === "__new__") {
        const name = $("tag-new").value.trim();
        const res = await fetch(`${BASE}/api/tags`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({name}),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          $("tag-err").textContent = body.error || "Could not create that tag";
          $("tag-err").hidden = false;
          return;
        }
        tagId = body.tag.id;
        await refreshTags();
      }
      $("tagger").close();
      commitStep({type: "take_snapshot", tag: tagId}, tagEditIndex);
      syncTools(); updateInfo(); draw();
    }

    // ---- side view / mobile panes ---------------------------------------
    async function setSideView(next) {
      sideView = next;
      for (const b of document.querySelectorAll(".side-head .tabs button"))
        b.setAttribute("aria-pressed", String(b.dataset.view === next));
      $("side-steps").hidden = next !== "steps";
      $("side-yaml").hidden = next !== "yaml";
      if (next === "yaml") {
        collectFromUi();
        const res = await fetch(`${BASE}/api/tasks/yaml`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({steps: stepsState}),
        });
        $("t-yaml").value = ((await res.json()).yaml) || "";
      }
    }

    function setPane(next) {
      document.body.classList.toggle("show-map", next === "map");
      document.body.classList.toggle("show-steps", next === "steps");
      for (const b of document.querySelectorAll(".ed-tabs button"))
        b.setAttribute("aria-pressed", String(b.dataset.pane === next));
      if (next === "map") draw();
    }

    // ---- save ------------------------------------------------------------
    // Same pairing rule the server enforces (record_clip↔end_clip), checked
    // here first so the editor can point at it before a save round-trip. A
    // clip with no end_clip would never be saved - a mistake worth catching on
    // save. The camera stream is managed around the whole task, so no step
    // ever has to open or close it.
    function pairError(steps) {
      // Each if-classification branch must balance on its own (a clip started
      // in one branch must end in that same branch); otherwise the clip state
      // after the conditional depends on which branch ran. The conditional
      // itself neither opens nor closes a clip.
      function walk(list) {
        let clips = 0;
        for (const s of list) {
          if (s.type === "if_classification") {
            for (const k in (s.cases || {})) {
              const e = walk(s.cases[k]);
              if (e) return e;
            }
            if (s.default) {
              const e = walk(s.default);
              if (e) return e;
            }
            continue;
          }
          if (s.type === "record_clip") clips++;
          else if (s.type === "end_clip") clips--;
          if (clips < 0) return "An end_clip appears before its record_clip.";
        }
        if (clips > 0)
          return "A record_clip step has no matching end_clip - the recording would never be saved. Add an end_clip.";
        return null;
      }
      return walk(steps);
    }

    async function saveTask() {
      $("top-err").hidden = true;
      let steps;
      if (sideView === "yaml") {
        const res = await fetch(`${BASE}/api/tasks/yaml`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({yaml: $("t-yaml").value}),
        });
        const parsed = await res.json();
        if (!res.ok) return topFail(parsed.error || "Could not read that YAML");
        steps = parsed.steps;
      } else {
        steps = collectFromUi();
        const err = pairError(steps);
        if (err) return topFail(err);
      }
      const res = await fetch(`${BASE}/api/tasks`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          slug: $("t-slug").value || undefined,
          previous_slug: TASK ? TASK.slug : undefined,
          name: $("t-name").value.trim(),
          did: $("t-did").value, steps,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return topFail(body.error || `Save failed (${res.status})`);
      dirty = false;
      location.href = `${BASE}/tasks`;
    }

    function topFail(message) {
      $("top-err").textContent = message;
      $("top-err").hidden = false;
    }

    // ---- wiring ----------------------------------------------------------
    document.addEventListener("click", e => {
      const t = e.target.closest("button, [data-selrow], [data-room-chosen]");
      if (!t) return;
      // Nested controls inside if-classification branches.
      if (t.dataset.ifcAdd !== undefined) {
        let list;
        try { list = resolvePath(JSON.parse(t.dataset.ifcAdd)); } catch { return; }
        collectFromUi();
        const menu = t.closest(".ifc-addmenu");
        const sel = menu && menu.querySelector("[data-ifc-newtype]");
        list.push({type: sel ? sel.value : "return_to_dock"});
        dirty = true; renderSteps();
        return;
      }
      if (t.dataset.ifcClear !== undefined) {
        let ref;
        try { ref = JSON.parse(t.dataset.ifcClear); } catch { return; }
        const step = resolvePath(ref);
        if (step && step.type === "if_classification" && step.cases) {
          step.cases[t.dataset.label] = [];
          dirty = true; renderSteps();
        }
        return;
      }
      if (t.dataset.bup !== undefined || t.dataset.bdown !== undefined || t.dataset.brm !== undefined) {
        let list;
        try { list = resolvePath(JSON.parse(t.dataset.bpath)); } catch { return; }
        collectFromUi();
        const k = Number(t.dataset.bidx);
        if (t.dataset.bup !== undefined && k > 0) {
          [list[k - 1], list[k]] = [list[k], list[k - 1]];
        } else if (t.dataset.bdown !== undefined && k < list.length - 1) {
          [list[k + 1], list[k]] = [list[k], list[k + 1]];
        } else if (t.dataset.brm !== undefined) {
          list.splice(k, 1);
        }
        dirty = true; renderSteps();
        return;
      }
      // Room chips in a clean_rooms step: tap to add to the end / remove.
      if (t.dataset.roomChosen !== undefined) {
        const i = Number(t.dataset.roomChosen);
        const step = stepsState[i];
        if (step && step.type === "clean_rooms") {
          const room = Number(t.dataset.room);
          const list = Array.isArray(step.rooms) ? step.rooms.slice() : [];
          const at = list.indexOf(room);
          if (at >= 0) list.splice(at, 1);
          else list.push(room);
          step.rooms = list;
          dirty = true; renderSteps();
        }
        return;
      }
      // Reorder / remove a room within a clean_rooms step.
      if (t.dataset.roomUp !== undefined || t.dataset.roomDown !== undefined ||
          t.dataset.roomRm !== undefined) {
        const i = Number(t.dataset.roomUp ?? t.dataset.roomDown ?? t.dataset.roomRm);
        const room = Number(t.dataset.room);
        const step = stepsState[i];
        if (step && Array.isArray(step.rooms)) {
          const at = step.rooms.indexOf(room);
          if (at >= 0) {
            if (t.dataset.roomUp !== undefined && at > 0) {
              [step.rooms[at - 1], step.rooms[at]] = [step.rooms[at], step.rooms[at - 1]];
            } else if (t.dataset.roomDown !== undefined && at < step.rooms.length - 1) {
              [step.rooms[at + 1], step.rooms[at]] = [step.rooms[at], step.rooms[at + 1]];
            } else if (t.dataset.roomRm !== undefined) {
              step.rooms.splice(at, 1);
            }
          }
          dirty = true; renderSteps();
        }
        return;
      }
      if (t.id === "save-task") saveTask();
      else if (t.id === "draft-save") saveDraft();
      else if (t.id === "draft-cancel") cancelDraft();
      else if (t.id === "tool-location") armLocation(null, null);
      else if (t.id === "tool-heading" && !t.disabled) armHeading(null, null);
      else if (t.id === "tool-snapshot" && !t.disabled) openTagger(null);
      else if (t.id === "tool-cleanrooms") armRooms(null, null);
      else if (t.id === "tool-dock") { commitStep({type: "return_to_dock"}, null); }
      else if (t.id === "map-refresh") { t.disabled = true; loadMap(true).finally(() => t.disabled = false); }
      else if (t.id === "add-step") { commitStep({type: $("add-type").value}, null); }
      else if (t.id === "tag-cancel") $("tagger").close();
      else if (t.id === "tag-save") saveTag();
      else if (t.dataset.view) setSideView(t.dataset.view);
      else if (t.dataset.pane) setPane(t.dataset.pane);
      else if (t.dataset.mapedit !== undefined) {
        const i = Number(t.dataset.mapedit);
        const step = stepsState[i];
        setPane("map");
        if (step.type === "go_to_point") {
          armLocation(i, step.x !== undefined ? {x: Number(step.x), y: Number(step.y)} : null);
        } else if (step.type === "rotate_to_heading") {
          armHeading(i, step.heading !== undefined ? Number(step.heading) : null);
        } else if (step.type === "take_snapshot") {
          openTagger(i);
        } else if (step.type === "clean_rooms") {
          armRooms(i, step.rooms || []);
        }
      }
      else if (t.dataset.rm !== undefined) {
        dirty = true; collectFromUi();
        stepsState.splice(Number(t.dataset.rm), 1);
        if (selIndex >= stepsState.length) selIndex = stepsState.length - 1;
        renderSteps();
      }
      else if (t.dataset.up !== undefined) {
        dirty = true; collectFromUi(); const i = Number(t.dataset.up);
        [stepsState[i - 1], stepsState[i]] = [stepsState[i], stepsState[i - 1]];
        if (selIndex === i) selIndex = i - 1;
        renderSteps();
      }
      else if (t.dataset.down !== undefined) {
        dirty = true; collectFromUi(); const i = Number(t.dataset.down);
        [stepsState[i + 1], stepsState[i]] = [stepsState[i], stepsState[i + 1]];
        if (selIndex === i) selIndex = i + 1;
        renderSteps();
      }
      else if (t.dataset.selrow !== undefined) {
        collectFromUi();
        selectStep(Number(t.dataset.selrow));
      }
    });

    $("back").addEventListener("click", e => {
      if (dirty && !confirm("Leave without saving? Your changes will be lost.")) {
        e.preventDefault();
      }
    });
    $("t-did").addEventListener("change", () => { dirty = true; loadMap(false); });

    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(() => draw()).observe($("map-wrap"));
    }
    boot();
  </script>
</body>
</html>
