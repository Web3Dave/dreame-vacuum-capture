<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapshots - Dreame Companion</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
      --text: #1c1e21; --muted: #6b7280; --accent: #03a9f4; --ok: #2e7d32; --bad: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1b1f24; --line:#2b3138; --text:#e8eaed; --muted:#9aa4b2; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text);
           font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    h1 { font-size:20px; margin:0; font-weight:600; }
    .sub { color:var(--muted); font-size:13px; }
    .pill { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    .pill.ok { color:var(--ok); border-color:var(--ok); }
    .pill.bad { color:var(--bad); border-color:var(--bad); }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .card h2 { font-size:16px; margin:0 0 2px; font-weight:600; }
    .model { color:var(--muted); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
    td { padding:5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
    td:first-child { color:var(--muted); width:38%; }
    td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
    .empty { background:var(--card); border:1px dashed var(--line); border-radius:12px;
             padding:28px; text-align:center; color:var(--muted); }
    code { background:rgba(127,127,127,.14); padding:1px 5px; border-radius:4px;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
    footer { margin-top:28px; color:var(--muted); font-size:12px; }
    nav { display:flex; gap:4px; margin:0 0 20px; border-bottom:1px solid var(--line); }
    nav a { padding:8px 14px; text-decoration:none; color:var(--muted); font-size:14px;
            border-bottom:2px solid transparent; margin-bottom:-1px; }
    nav a:hover { color:var(--text); }
    nav a[aria-current="page"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
    .todo { margin-top:24px; }
    .todo ul { margin:8px 0 0; padding-left:20px; }
    .todo li { margin:3px 0; }
  </style>
  <style>
    nav { display:flex; gap:4px; margin:0 0 20px; border-bottom:1px solid var(--line); }
    nav a { padding:8px 14px; text-decoration:none; color:var(--muted); font-size:14px;
            border-bottom:2px solid transparent; margin-bottom:-1px; }
    nav a:hover { color:var(--text); }
    nav a[aria-current="page"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
    .tag { margin-bottom:26px; }
    .tag h2 { font-size:15px; margin:0 0 2px; font-weight:600;
              font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .tag .sub { display:block; margin-bottom:10px; }
    .shots { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
    figure { margin:0; background:var(--card); border:1px solid var(--line);
             border-radius:10px; overflow:hidden; }
    figure a { display:block; line-height:0; }
    figure img { width:100%; aspect-ratio:16/9; object-fit:cover; background:rgba(127,127,127,.15); }
    figcaption { padding:7px 10px; font-size:12px; color:var(--muted);
                 font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Dreame Companion</h1>
    {% if viewer %}<span class="sub">signed in as {{ viewer }}</span>{% endif %}
  </header>
  <nav>
    <a href="{{ base }}/">Devices</a>
    <a href="{{ base }}/tasks"{% if page == 'tasks' %} aria-current="page"{% endif %}>Tasks</a>
    <a href="{{ base }}/snapshots"{% if page == 'snapshots' %} aria-current="page"{% endif %}>Snapshots</a>
    <a href="{{ base }}/classifications"{% if page == 'classifications' %} aria-current="page"{% endif %}>Classifications</a>
    <a href="{{ base }}/activity"{% if page == 'activity' %} aria-current="page"{% endif %}>Activity</a>
  </nav>

  <div id="groups"></div>
  <footer id="foot"></footer>

  <script>
    const BASE = "{{ base }}";
    const esc = v => String(v ?? "").replace(/[&<>"]/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

    fetch(`${BASE}/api/snapshots`).then(r => r.json()).then(body => {
      const groups = body.snapshots || [];
      if (!groups.length) {
        document.getElementById("groups").innerHTML = `<div class="empty">
          <p style="margin:0 0 6px"><strong>No snapshots yet</strong></p>
          <p style="margin:0">Photos appear here grouped by tag, newest first.</p></div>`;
        return;
      }
      document.getElementById("groups").innerHTML = groups.map(g => `
        <section class="tag">
          <h2>${esc(g.tag)}</h2>
          <span class="sub">${g.count} photo${g.count === 1 ? "" : "s"}</span>
          <div class="shots">
            ${g.snapshots.map(s => `
              <figure>
                <a href="${BASE}/snapshot/${encodeURIComponent(g.tag)}/${encodeURIComponent(s.filename)}"
                   target="_blank" rel="noopener">
                  <img loading="lazy" alt="${esc(s.filename)}"
                       src="${BASE}/snapshot/${encodeURIComponent(g.tag)}/${encodeURIComponent(s.filename)}">
                </a>
                <figcaption>${new Date(s.taken_at * 1000).toLocaleString()}</figcaption>
              </figure>`).join("")}
          </div>
        </section>`).join("");
      const total = groups.reduce((n, g) => n + g.count, 0);
      document.getElementById("foot").textContent =
        `${total} snapshot${total === 1 ? "" : "s"} across ${groups.length} tag${groups.length === 1 ? "" : "s"}.`;
    });
  </script>
</body>
</html>
