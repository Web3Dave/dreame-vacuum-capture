name: Dreame Vacuum Companion
description: >-
  Companion backend for the Dreame Vacuum Core integration. Pulls snapshots
  and RTSP streams from the vacuum's onboard camera via Tencent's XP2P SDK,
  and hosts the control panel UI. Install the dreame_vacuum_core integration
  alongside it - that owns the vacuum entities and drives this add-on's API.
version: "3.29.0"
slug: dreame_vacuum_companion
url: https://github.com/Web3Dave/dreame-vacuum-companion
init: false
arch:
  - amd64
startup: application
boot: auto

# UI panel in the HA sidebar. Ingress is authenticated by Home Assistant, so
# the UI needs no login of its own - and deliberately runs on a *different*
# port from the token-authenticated machine API below.
ingress: true
ingress_port: 8100
panel_icon: mdi:robot-vacuum
panel_title: Dreame
panel_admin: false

# Lets the UI read entity state and call services instead of duplicating
# vacuum state that Home Assistant already owns.
homeassistant_api: true

# "want" rather than "need": classification results are broadcast over MQTT
# when a broker is available (the Supervisor injects MQTT_HOST/PORT/USERNAME/
# PASSWORD automatically - nothing to configure), but their absence must not
# block the add-on from starting, since MQTT is optional and classification
# itself is disabled by default.
#
# The mqtt_* options below exist for when that auto-discovery is not enough
# on its own - a broker outside what Supervisor can see, or a dedicated MQTT
# user rather than whatever it discovered. Anything set here wins over the
# injected values; leave them blank and discovery is still tried first.
services:
  - mqtt:want

ports:
  8099/tcp: 8099
  8554/tcp: 8554
ports_description:
  8099/tcp: HTTP API (called by the dreame_vacuum_core integration)
  8554/tcp: RTSP (one path per device, e.g. rtsp://<host>:8554/<did>)

options:
  api_token: ""
  stream_timeout_minutes: 30
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  api_token: str
  stream_timeout_minutes: int?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?

map:
  - media:rw
