name: Dreame Vacuum Camera Capture
description: >-
  Backend engine for the Dreame Vacuum Camera Capture integration. Talks to
  Dreame's cloud API and Tencent's XP2P SDK to pull snapshots and RTSP
  streams from your vacuum's onboard camera. Not meant to be used directly -
  install the companion custom integration, which drives this add-on's API.
version: "2.4.0"
slug: dreame_capture
url: https://github.com/Web3Dave/dreame-vacuum-video-capture
init: false
arch:
  - amd64
startup: application
boot: auto

ports:
  8099/tcp: 8099
  8554/tcp: 8554
ports_description:
  8099/tcp: HTTP API (called by the Dreame Vacuum Camera Capture integration)
  8554/tcp: RTSP (one path per device, e.g. rtsp://<host>:8554/<did>)

options:
  api_token: ""
  stream_timeout_minutes: 30

schema:
  api_token: str
  stream_timeout_minutes: int?

map:
  - media:rw
